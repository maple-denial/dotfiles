# ~/.config/kitty/kitty.conf
# 字体：Maple Mono NF CN（Nerd Font 图标 + 中文字形），字号 14pt
font_family      Maple Mono NF CN
font_size        14

# 各字重显式写死：kitty 的 auto 会把 Bold 错配成 SemiBold
bold_font        Maple Mono NF CN Bold
italic_font      Maple Mono NF CN Italic
bold_italic_font Maple Mono NF CN Bold Italic

# 连字（=> != -> 等）默认开启，Maple Mono 自带连字；如需关闭取消下行注释
# disable_ligatures always
